name: research-rag

# Local production-shaped demonstration, not a high-availability deployment.
# Managed Qdrant or a replicated cluster is the production recommendation.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Export OPENAI_API_KEY first}
      RAG_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8477:8477"
    volumes:
      - rag-data:/var/lib/research-rag

volumes:
  qdrant-data:
  rag-data:
