[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-rag"
version = "2.0.0"
description = "A production-shaped RAG chatbot over machine-learning papers, written to be read"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.10,<2",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pymupdf>=1.25,<2",
    "pyyaml>=6,<7",
    "qdrant-client>=1.19,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[project.scripts]
research-rag = "research_rag.cli:main"

[project.urls]
Repository = "https://github.com/coding-parrot/research-rag"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_rag = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # formatter cannot wrap teaching prose, prompts, or test fixtures
    "RUF100", # explanatory broad-exception noqa comments remain useful to readers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"] # confusable Unicode is intentional guardrail input

[tool.mypy]
python_version = "3.12"
packages = ["research_rag"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
