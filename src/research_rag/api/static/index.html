<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>research-rag</title>
  <style>
    body { background:#111; color:#eee; font:16px/1.6 system-ui; max-width:52rem; margin:3rem auto; padding:0 1rem }
    input { flex:1; padding:.7rem; font-size:1rem; background:#1c2128; color:#eee; border:1px solid #333; border-radius:8px }
    button { padding:.7rem 1.4rem; font-size:1rem; background:#4a6cd4; color:#fff; border:0; border-radius:8px; cursor:pointer }
    form { display:flex; gap:.6rem }
    #out { margin-top:1.5rem; white-space:pre-wrap }
    .src { color:#8b949e; font-size:.9rem; margin-top:1rem }
    .refused { color:#e3b341 }
  </style>
</head>
<body>
  <main>
    <h1>research-rag</h1>
    <p>Ask about the indexed papers. Answers cite their sources.</p>
    <form id="question-form">
      <input id="question" aria-label="Question" maxlength="500"
             placeholder="How does retrieval-augmented generation use evidence?" required autofocus>
      <button>Ask</button>
    </form>
    <div id="out" aria-live="polite"></div>
  </main>
  <script>
    const form = document.querySelector("#question-form");
    const question = document.querySelector("#question");
    const out = document.querySelector("#out");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      out.textContent = "thinking...";
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify({question: question.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The service is unavailable.");
        out.textContent = "";
        const answer = document.createElement("p");
        answer.textContent = data.answer;
        if (data.refused) answer.className = "refused";
        out.append(answer);
        data.citations.forEach((citation, index) => {
          const source = document.createElement("div");
          source.className = "src";
          source.textContent = `[${index + 1}] ${citation.source} — “${citation.quote}”`;
          out.append(source);
        });
      } catch (error) {
        out.textContent = error.message;
        out.className = "refused";
      }
    });
  </script>
</body>
</html>
